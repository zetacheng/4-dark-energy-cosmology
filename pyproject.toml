[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-energy-cosmology-research"
version = "0.0.0"
description = "Research infrastructure for Paper 4: Dark Energy, Sea–Interface Dynamics and Cosmology"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Zeta Cheng" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: long-running regression that regenerates a full gate (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Migrated legacy gate scripts are preserved as-run from kappa-c2a; they are not
# restyled, because reformatting could perturb the historical numerical record.
"scripts/*.py" = ["ALL"]
